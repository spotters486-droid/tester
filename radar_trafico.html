<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spotters Spain · Radar Local Leaflet</title>

  <!-- Iconos FontAwesome y Leaflet CSS/JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-color: #050814;
      --neon-cyan: #00d2ff;
      --neon-green: #00ffcc;
      --neon-red: #ff0055;
      --neon-gold: #ffcc00;
      --neon-purple: #b026ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: linear-gradient(180deg, #070a1a 0%, #0c102b 100%);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid var(--neon-cyan);
      z-index: 10;
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .heavy-selector-bar {
      background: #03050d;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      overflow-x: auto;
    }

    .btn-heavy-model, .select-heavy-model {
      background: rgba(255, 204, 0, 0.08);
      color: var(--neon-gold);
      border: 1px solid var(--neon-gold);
      padding: 3px 10px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-heavy-model.active, .btn-heavy-model:hover {
      background: var(--neon-gold);
      color: #000;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel-header {
      background: #03050d;
      padding: 4px 10px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 210, 255, 0.3);
      color: var(--neon-green);
    }

    #traffic-map {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #07111a;
    }

    .traffic-status {
      color: var(--neon-cyan);
      font-size: 0.65rem;
    }

    /* Estilo del icono del avión rotado con SVG */
    .fr24-plane-container {
      will-change: transform;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    footer {
      background: #03050d;
      padding: 4px 8px;
      font-size: 0.65rem;
      color: #7a8b9e;
      text-align: center;
      border-top: 1px solid rgba(0, 210, 255, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-crosshairs"></i> Spotters Spain · Radar Local</h1>
  </header>

  <div class="heavy-selector-bar">
    <button class="btn-heavy-model active" id="btn-all" onclick="setFilter('ALL')">Todo</button>
    <button class="btn-heavy-model" id="btn-heavy" onclick="setFilter('HEAVY')">Heavies</button>
    <button class="btn-heavy-model" id="btn-mil" onclick="setFilter('MIL')">Militar</button>
  </div>

  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <span id="tma-text">TMA BCN · Posiciones en tiempo real</span>
        <span class="traffic-status" id="traffic-status">Conectando...</span>
      </div>
      <div id="traffic-map"></div>
    </div>
  </div>

  <footer>Spotters Spain · Datos de tráfico en directo</footer>

  <script>
    let map;
    let aircraftLayer;
    let activeMarkers = new Map();
    let currentFilter = 'ALL';
    
    // Coordenadas base (Barcelona - El Prat)
    const centerLat = 41.30;
    const centerLon = 2.08;
    const radiusNM = 100; // Radio de búsqueda en millas náuticas

    // Categorías de aviones pesados (Widebody)
    const HEAVY_TYPES = new Set(['A332','A333','A338','A339','A350','A359','A388','B744','B748','B772','B77W','B788','B789','B78X']);

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
    });

    function initMap() {
      map = L.map('traffic-map', { zoomControl: true }).setView([centerLat, centerLon], 10);
      
      // Capa de mapa oscuro/híbrido limpio de OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      aircraftLayer = L.layerGroup().addTo(map);

      // Cargar al iniciar y refrescar cada 15 segundos
      fetchAircraftPositions();
      setInterval(fetchAircraftPositions, 15000);
    }

    async function fetchAircraftPositions() {
      const status = document.getElementById('traffic-status');
      status.textContent = 'Actualizando posiciones...';

      try {
        // Petición directa a la API pública compatible con formato ADS-B
        const url = `https://api.adsb.lol/v2/lat/${centerLat}/lon/${centerLon}/dist/${radiusNM}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Error en la respuesta de la red');
        
        const data = await response.json();
        const aircraftList = data.ac || data.aircraft || [];
        
        renderAircraft(aircraftList);
        status.textContent = `${aircraftList.length} aeronaves activas`;
      } catch (error) {
        status.textContent = 'Error al actualizar posiciones';
        console.error('Error fetching adsb data:', error);
      }
    }

    function renderAircraft(aircraftList) {
      const currentIds = new Set();

      aircraftList.forEach(ac => {
        if (ac.lat == null || ac.lon == null) return;

        const type = String(ac.t || '').toUpperCase();
        const isMil = ac.mil === true;
        const isHeavy = HEAVY_TYPES.has(type) || ac.category === 'A5';

        // Aplicar filtros locales de la botonera
        if (currentFilter === 'HEAVY' && !isHeavy) return;
        if (currentFilter === 'MIL' && !isMil) return;

        const id = ac.hex || `${ac.lat},${ac.lon}`;
        currentIds.add(id);

        const lat = Number(ac.lat);
        const lon = Number(ac.lon);
        const track = Number(ac.track) || 0;
        const flight = String(ac.flight || '').trim() || ac.hex || 'N/A';
        const altitude = ac.alt_baro === 'ground' ? 'En tierra' : `${ac.alt_baro || '—'} ft`;
        const speed = `${Math.round(ac.gs || 0)} kt`;

        // HTML del icono del avión rotado con CSS transform
        const iconHtml = `
          <div class="fr24-plane-container" style="transform: rotate(${track}deg);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffcc00" stroke="#000000" stroke-width="1">
              <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>
          </div>`;

        const customIcon = L.divIcon({
          html: iconHtml,
          className: '',
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        const popupContent = `
          <div style="font-size: 0.75rem; color: #000;">
            <strong>Vuelo:</strong> ${flight}<br>
            <strong>Modelo:</strong> ${type || 'Desconocido'}<br>
            <strong>Altitud:</strong> ${altitude}<br>
            <strong>Velocidad:</strong> ${speed}
          </div>`;

        if (activeMarkers.has(id)) {
          // Actualizar posición y rotación sin recrear el marcador (movimiento fluido)
          const marker = activeMarkers.get(id);
          marker.setLatLng([lat, lon]);
          marker.setIcon(customIcon);
          marker.getPopup().setContent(popupContent);
        } else {
          // Crear marcador nuevo
          const marker = L.marker([lat, lon], { icon: customIcon }).bindPopup(popupContent);
          aircraftLayer.addLayer(marker);
          activeMarkers.set(id, marker);
        }
      });

      // Eliminar del mapa los aviones que ya salieron del radio o murieron
      for (const [id, marker] of activeMarkers.entries()) {
        if (!currentIds.has(id)) {
          aircraftLayer.removeLayer(marker);
          activeMarkers.delete(id);
        }
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.btn-heavy-model').forEach(b => b.classList.remove('active'));
      if (filter === 'ALL') document.getElementById('btn-all').classList.add('active');
      if (filter === 'HEAVY') document.getElementById('btn-heavy').classList.add('active');
      if (filter === 'MIL') document.getElementById('btn-mil').classList.add('active');
      fetchAircraftPositions();
    }
  </script>
</body>
</html>
