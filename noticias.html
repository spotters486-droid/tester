  <style>
  :root{
    color-scheme: dark;
    --bg: #030712;
    --panel: rgba(11, 20, 42, 0.72);
    --cyan: #00f3ff;
    --green: #00ff9d;
    --text: #f0f6fc;
    --muted: #8b9bb4;
    --line: rgba(0, 243, 255, 0.16);
    font-family: Inter, Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body{
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, rgba(0,243,255,0.06), transparent 50%),
                radial-gradient(circle at 85% 85%, rgba(0,255,157,0.04), transparent 40%),
                linear-gradient(rgba(0,243,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,243,255,0.02) 1px, transparent 1px),
                var(--bg);
    background-size: auto, auto, 20px 20px, 20px 20px, auto;
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* HEADER COMPACTO MOBILE-FIRST */
  header{
    position: sticky;
    top: 0;
    z-index: 10;
    height: 52px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    background: rgba(3, 7, 18, 0.9);
    backdrop-filter: blur(14px);
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-dot{
    width: 8px;
    height: 8px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--cyan);
  }
  .brand-title{
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    line-height: 1;
  }
  .brand-sub{
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 6px;
    background: rgba(0, 243, 255, 0.08);
    border-radius: 4px;
    border: 1px solid rgba(0, 243, 255, 0.15);
  }

  main{
    width: min(1000px, 100%);
    margin: 0 auto;
    padding: 8px 8px 24px;
    flex: 1;
  }

  .section-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 0;
  }

  h2.section-title{
    margin: 0;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--cyan);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* BOTONES Y CAMPOS ULTRA-ERGONÓMICOS */
  button, .btn{
    border: 1px solid rgba(0,243,255,0.3);
    border-radius: 6px;
    background: linear-gradient(135deg, rgba(0,243,255,0.85), rgba(0,255,157,0.85));
    color: #020c14;
    padding: 5px 10px;
    font: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0,243,255,0.15);
    transition: all 0.15s ease;
    white-space: nowrap;
    touch-action: manipulation;
  }
  button:active{
    transform: scale(0.97);
  }
  button.secondary{
    background: rgba(0, 243, 255, 0.06);
    color: var(--cyan);
    border-color: rgba(0, 243, 255, 0.22);
    box-shadow: none;
    font-weight: 600;
  }
  button.secondary:hover, button.secondary:active{
    background: rgba(0, 243, 255, 0.14);
    color: var(--green);
    border-color: rgba(0, 255, 157, 0.35);
  }

  button.danger{background:rgba(255,70,100,0.12);color:#ff7890;border-color:rgba(255,70,100,0.4);box-shadow:none}
  button.danger:hover{background:rgba(255,70,100,0.22)}
  input, textarea, select{
    width: 100%;
    border: 1px solid rgba(0,243,255,0.22);
    border-radius: 6px;
    background: rgba(3, 7, 18, 0.82);
    color: #fff;
    padding: 6px 10px;
    font: inherit;
    font-size: 0.8rem;
    transition: border-color 0.2s;
  }
  input[type="date"]{
    padding: 4px 8px;
    font-size: 0.78rem;
    color-scheme: dark;
  }
  input:focus, textarea:focus, select:focus{
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(0,243,255,0.25);
    outline: none;
  }

  label{
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: #b8cbdc;
    font-size: 0.75rem;
  }

  /* ESTILO PARA ENLACES A REDES SOCIALES Y WEBS */
  .news-link{
    color: #00f3ff !important;
    text-decoration: underline;
    font-weight: 600;

/**
 * CONVERTIDOR DE ENLACES A AZUL E INTEGRACIÓN CON APPS DE FACEBOOK E INSTAGRAM
 */
function linkify(text) {
  if (!text) return '';
  const escaped = esc(text);
  const urlRegex = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/g;

  return escaped.replace(urlRegex, (url) => {
    let fullUrl = url.startsWith('www.') ? 'https://' + url : url;
    let icon = '🔗 ';
    let label = url;

    if (fullUrl.includes('facebook.com') || fullUrl.includes('fb.watch') || fullUrl.includes('fb.me')) {
      icon = '📘 ';
      label = 'Facebook';
    } else if (fullUrl.includes('instagram.com') || fullUrl.includes('instagr.am')) {
      icon = '📸 ';
      label = 'Instagram';
    } else if (fullUrl.includes('twitter.com') || fullUrl.includes('x.com')) {
      icon = '🐦 ';
      label = 'X / Twitter';
    } else if (fullUrl.includes('youtube.com') || fullUrl.includes('youtu.be')) {
      icon = '▶️ ';
      label = 'YouTube';
    }

    return `<a href="${fullUrl}" target="_blank" rel="noopener noreferrer" class="news-link" onclick="event.stopPropagation();">${icon}${label}</a>`;
  });
}

/**
 * MOTOR DE ANÁLISIS TEXTUAL REAL (PALABRA POR PALABRA Y FRASE POR FRASE)
 */
function analyzeExactText(title, body) {
  const fullText = title + ". " + body;
  const sentences = fullText.split(/(?<=[.?!])\s+/).filter(s => s.trim().length > 5);

  const posWords = ['nuevo', 'nueva', 'ampliación', 'mejora', 'éxito', 'apertura', 'inauguración', 'crecimiento', 'incorporación', 'avance', 'incremento', 'modernización', 'solución', 'seguridad', 'beneficio', 'eficiencia', 'acuerdo', 'aprobado', 'positivo', 'superación'];
  const negWords = ['retraso', 'demora', 'cancelación', 'problema', 'falla', 'error', 'accidente', 'incidencia', 'riesgo', 'cierre', 'reducción', 'pérdida', 'conflicto', 'huelga', 'alerta', 'coste', 'restricción', 'suspendido', 'daño', 'negativo', 'afectado'];

  const posSentences = [];
  const negSentences = [];

  sentences.forEach(s => {
    const sLower = s.toLowerCase();
    let posScore = 0;
    let negScore = 0;

    posWords.forEach(w => { if (sLower.includes(w)) posScore++; });
    negWords.forEach(w => { if (sLower.includes(w)) negScore++; });

    if (posScore > negScore) {
      posSentences.push(s.trim());
    } else if (negScore > posScore) {
      negSentences.push(s.trim());
    }
  });

  const posResult = posSentences.length > 0 ? posSentences : [];
  const negResult = negSentences.length > 0 ? negSentences : [];

  if (posResult.length === 0) {
    posResult.push(`Divulgación directa de información sobre "${title.trim()}" que mantiene informada a la comunidad.`);
  }

  if (negResult.length === 0) {
    negResult.push(`El comunicado sobre "${title.trim()}" requiere seguimiento para evaluar su impacto operativo definitivo.`);
  }

  return { pos: posResult, neg: negResult };
}

// Compresión ultrarrápida de imagen en cliente (HTML5 Canvas)
function compressImage(file, maxWidth = 800, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let width = img.width;
      let height = img.height;
      
      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }
      
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      canvas.toBlob(blob => {
        if (blob) {
          const resizedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
            type: 'image/jpeg',
            lastModified: Date.now()
          });
          resolve(resizedFile);
        } else {
          reject(new Error("Error al exportar blob"));
        }
      }, 'image/jpeg', quality);
    };

    img.onerror = (err) => {
      URL.revokeObjectURL(objectUrl);
      reject(err);
    };

    img.src = objectUrl;
  });
}

    $('#filterToggleBtn').textContent = '🔍 Filtro activo';
  } else {
    $('#filterToggleBtn').textContent = '🔍 Filtros';
  }
  $('#filterWrapper').classList.remove('open');
  reset();
};

$('#clear').onclick=()=>{
  $('#from').value=$('#to').value='';
  filter={};
  $('#filterToggleBtn').textContent = '🔍 Filtros';
  $('#filterWrapper').classList.remove('open');
  reset();
};

$('#next').onclick=()=>{
  offset=items.length;
  load();
};

$('#close').onclick=()=>$('#modal').classList.add('hide');
$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.add('hide');};
</script>
</body>
</html>
