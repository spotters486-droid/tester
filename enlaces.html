function openExternalUrl(event, url) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }
    
    const targetUrl = url || (event && event.currentTarget ? event.currentTarget.href : null);
    if (!targetUrl) return false;

    if (window.cordova && window.cordova.InAppBrowser) {
        window.cordova.InAppBrowser.open(targetUrl, '_system', 'location=yes');
    } 
    else if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
        window.Capacitor.Plugins.Browser.open({ url: targetUrl });
    }
    else {
        window.open(targetUrl, '_system', 'location=yes,noopener,noreferrer');
    }

    return false;
}

document.addEventListener('click', function(e) {
    const link = e.target.closest('a');
    
    if (link && link.href) {
        const href = link.getAttribute('href');

        if (href.startsWith('#') || href.endsWith('.html')) {
            return;
        }

        e.preventDefault();
        e.stopPropagation();
        
        openExternalUrl(e, link.href);
    }
}, true);

let activeCategoryFilter = "all";
let activeAlphabetFilter = "all";

function initApp() {
    checkAndShowModal();
    renderAlphabetBar();

    // Carga directa de datos sin caché

    renderMembersCarousel(sortedMembers);
}

function renderAlphabetBar() {
    const alphaContainer = document.getElementById("alphabet-bar");
    if (!alphaContainer) return;

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    let buttonsHTML = `
        <button onClick="setAlphabetFilter('all', event)" class="alpha-btn active px-2 py-0.5 rounded bg-blue-600 text-white border border-blue-500 whitespace-nowrap transition-colors">
            A-Z
        </button>
    `;

    buttonsHTML += alphabet.map(letter => `
        <button onClick="setAlphabetFilter('${letter}', event)" 
                class="alpha-btn px-2 py-0.5 rounded bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition-colors">
            ${letter}
        </button>
    `).join('');

    alphaContainer.innerHTML = buttonsHTML;
}

function sortMembers(members) {
    return members.sort((a, b) => a.username.localeCompare(b.username));

function filterMembers() {
    const searchInput = document.getElementById("member-search");
    const query = searchInput ? searchInput.value.toLowerCase() : "";
    const cards = document.querySelectorAll(".member-card");

    cards.forEach(card => {
        const username = card.getAttribute("data-username") || "";
        const searchData = card.getAttribute("data-search") || "";
        const categories = JSON.parse(card.getAttribute("data-categories") || "[]");

        const matchesText = searchData.includes(query);
        const matchesCategory = activeCategoryFilter === "all" || categories.includes(activeCategoryFilter);
        const matchesAlphabet = activeAlphabetFilter === "all" || username.startsWith(activeAlphabetFilter.toLowerCase());

        card.style.display = (matchesText && matchesCategory && matchesAlphabet) ? "block" : "none";
    });
}

function setFilter(cat, evt) {
    activeCategoryFilter = cat;

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.className = "filter-btn px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition-colors";
    });

    if (evt && evt.target) {
        evt.target.className = "filter-btn active px-2.5 py-1 rounded-lg bg-pink-600 text-white border border-pink-500 whitespace-nowrap transition-colors";
    }

    filterMembers();
}

function setAlphabetFilter(letter, evt) {
    activeAlphabetFilter = letter;

    document.querySelectorAll(".alpha-btn").forEach(btn => {
        btn.className = "alpha-btn px-2 py-0.5 rounded bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition-colors";

        evt.target.className = "alpha-btn active px-2 py-0.5 rounded bg-blue-600 text-white border border-blue-500 whitespace-nowrap transition-colors";
    }

    filterMembers();
}

/* SISTEMA DE VOZ */
let voiceUnlocked = false;
let voiceStarted = false;
let voiceText = "";

function loadVoices() {
    if (!("speechSynthesis" in window)) return [];
    return window.speechSynthesis.getVoices();
}

function getSpanishVoice() {
    const voices = loadVoices();
    return voices.find(v => v.lang && v.lang.toLowerCase().startsWith("es")) || null;
}

function speakInfoText() {
    if (!("speechSynthesis" in window) || voiceStarted) return;

    const speechElem = document.getElementById("speech-text");
    if (!speechElem) return;

    const text = speechElem.innerText;
    voiceText = text;

    try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const spanishVoice = getSpanishVoice();

        if (spanishVoice) {
            utterance.voice = spanishVoice;
            utterance.lang = spanishVoice.lang;
        } else {
            utterance.lang = "es-ES";
        }

        utterance.rate = 0.95;
        utterance.pitch = 1;
        utterance.volume = 1;

        utterance.onstart = function () { voiceStarted = true; };
        utterance.onerror = function () { voiceStarted = false; };

        window.speechSynthesis.speak(utterance);
    } catch (error) {
        voiceStarted = false;
    }
}

function unlockVoice() {
    if (voiceUnlocked) return;
    voiceUnlocked = true;

    if (!("speechSynthesis" in window)) return;

    const speechElem = document.getElementById("speech-text");
    const text = voiceText || (speechElem ? speechElem.innerText : "");
    if (!text) return;

    try {
        window.speechSynthesis.cancel();
        const voice = getSpanishVoice();
        const unlockUtterance = new SpeechSynthesisUtterance(text);

        unlockUtterance.lang = voice ? voice.lang : "es-ES";
        unlockUtterance.rate = 0.95;
        unlockUtterance.pitch = 1;
        unlockUtterance.volume = 1;

        if (voice) unlockUtterance.voice = voice;

        unlockUtterance.onstart = function () { voiceStarted = true; };
        unlockUtterance.onerror = function () { voiceStarted = false; };

        window.speechSynthesis.speak(unlockUtterance);
    } catch (e) {}
}

document.addEventListener("touchstart", function () { unlockVoice(); }, { once: true, passive: true });
document.addEventListener("mousedown", function () { unlockVoice(); }, { once: true });

if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = function () { loadVoices(); };
    loadVoices();
}

/* MODAL */
function checkAndShowModal() {
    const modalShown = sessionStorage.getItem("spotters_hub_modal_shown_v1");

    if (!modalShown) {
        setTimeout(function () {
            const modal = document.getElementById("info-modal");
            if (modal) {
                modal.classList.remove("opacity-0", "pointer-events-none");
                speakInfoText();
                sessionStorage.setItem("spotters_hub_modal_shown_v1", "true");
            }
        }, 5000);
    }
}

function closeInfoModal() {
    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }

    const modal = document.getElementById("info-modal");
    if (modal) {
        modal.classList.add("opacity-0", "pointer-events-none");
        setTimeout(function () {
            modal.remove();
        }, 300);
    }
}

document.addEventListener("DOMContentLoaded", initApp);
